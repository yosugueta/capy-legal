<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capy — Legal</title>
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
    background:#f6f5f1;color:#1a1a1a;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .card{
    background:#fff;border-radius:24px;padding:48px 40px;
    max-width:520px;width:100%;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 40px -16px rgba(0,0,0,.08);
    border:1px solid rgba(0,0,0,.05);
  }
  h1{font-size:32px;margin:0 0 8px;letter-spacing:-0.02em;font-weight:700}
  .sub{color:#6b6b6b;margin:0 0 32px;font-size:15px}
  .links{display:grid;gap:12px;margin-bottom:24px}
  a.link{
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 20px;border-radius:14px;background:#f6f5f1;
    color:#1a1a1a;text-decoration:none;font-weight:500;
    border:1px solid transparent;transition:all .2s ease;
  }
  a.link:hover{background:#fff;border-color:rgba(0,0,0,.08);transform:translateY(-1px)}
  .arrow{color:#6b6b6b;font-size:18px}
  .foot{font-size:13px;color:#9a9a9a;text-align:center;margin-top:16px}
  .lang{display:flex;gap:8px;margin-top:6px}
  .lang span{font-size:11px;color:#6b6b6b;background:#ececec;padding:3px 8px;border-radius:99px}
</style>
</head>
<body>
  <div class="card">
    <h1>Capy</h1>
    <p class="sub">Legal documents · מסמכים משפטיים</p>

    <div class="links">
      <a class="link" href="./privacy.html">
        <span>Privacy Policy<div class="lang"><span>EN</span></div></span>
        <span class="arrow">→</span>
      </a>
      <a class="link" href="./privacy-he.html">
        <span>מדיניות פרטיות<div class="lang"><span>HE</span></div></span>
        <span class="arrow">←</span>
      </a>
      <a class="link" href="./terms.html">
        <span>Terms of Service<div class="lang"><span>EN</span></div></span>
        <span class="arrow">→</span>
      </a>
      <a class="link" href="./terms-he.html">
        <span>תנאי שימוש<div class="lang"><span>HE</span></div></span>
        <span class="arrow">←</span>
      </a>
    </div>

    <p class="foot">Contact: yosugueta09@gmail.com</p>
  </div>
</body>
</html>

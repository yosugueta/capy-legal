<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Capy · Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --blue:#1B7FFF;
    --blue-dark:#0E5FCC;
    --ink:#16202B;
    --muted:#5C6B7A;
    --line:#E7EBF0;
    --bg:#F4F7FB;
    --card:#FFFFFF;
  }
  html,body{height:100%}
  body{
    font-family:'Heebo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(27,127,255,.10), transparent 60%),
      radial-gradient(700px 400px at 10% 110%, rgba(27,127,255,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:28px;
    padding:44px 40px;
    max-width:540px;width:100%;
    box-shadow:0 1px 1px rgba(16,32,43,.04),0 24px 60px -28px rgba(16,32,43,.22);
  }
  .brandrow{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  .mark{
    width:46px;height:46px;border-radius:14px;
    background:linear-gradient(150deg,var(--blue),var(--blue-dark));
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:0 6px 16px -6px rgba(27,127,255,.6);
  }
  .mark svg{display:block}
  .brandtext h1{font-size:26px;font-weight:900;letter-spacing:-0.02em;line-height:1}
  .brandtext p{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
  .links{display:grid;gap:10px}
  a.link{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 18px;border-radius:16px;
    background:var(--bg);border:1px solid transparent;
    color:var(--ink);text-decoration:none;
    transition:background .18s ease,border-color .18s ease,transform .18s ease;
  }
  a.link:hover{background:#fff;border-color:var(--line);transform:translateY(-1px)}
  a.link:active{transform:translateY(0)}
  .ltitle{font-size:15px;font-weight:700}
  .ltag{
    display:inline-block;margin-top:3px;font-size:10px;font-weight:700;
    letter-spacing:.08em;color:var(--blue);
    background:rgba(27,127,255,.10);padding:2px 7px;border-radius:99px;
  }
  .arrow{color:var(--blue);font-size:17px;font-weight:700}
  .foot{
    margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
    font-size:13px;color:var(--muted);text-align:center;
  }
  .foot a{color:var(--blue);text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <div class="brandrow">
      <div class="mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 2.5c-3.6 0-6.5 2.7-6.5 6.2 0 2.1 1 3.7 2.3 5.2 1.4 1.6 2.6 3 3 5.3.1.6.5 1 1.2 1s1.1-.4 1.2-1c.4-2.3 1.6-3.7 3-5.3 1.3-1.5 2.3-3.1 2.3-5.2 0-3.5-2.9-6.2-6.5-6.2Z" fill="#fff"/>
          <circle cx="9.6" cy="8.4" r="1.15" fill="#1B7FFF"/>
          <circle cx="14.4" cy="8.4" r="1.15" fill="#1B7FFF"/>
        </svg>
      </div>
      <div class="brandtext">
        <h1>Capy</h1>
        <p>Legal documents · מסמכים משפטיים</p>
      </div>
    </div>

    <div class="links">
      <a class="link" href="./privacy.html">
        <span><span class="ltitle">Privacy Policy</span><br /><span class="ltag">ENGLISH</span></span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="link" href="./privacy-he.html">
        <span><span class="ltitle">מדיניות פרטיות</span><br /><span class="ltag">עברית</span></span>
        <span class="arrow">&larr;</span>
      </a>
      <a class="link" href="./terms.html">
        <span><span class="ltitle">Terms of Service</span><br /><span class="ltag">ENGLISH</span></span>
        <span class="arrow">&rarr;</span>
      </a>
      <a class="link" href="./terms-he.html">
        <span><span class="ltitle">תנאי שימוש</span><br /><span class="ltag">עברית</span></span>
        <span class="arrow">&larr;</span>
      </a>
    </div>

    <div class="foot">
      Contact · <a href="mailto:capy.vision@gmail.com">capy.vision@gmail.com</a>
    </div>
  </div>
</body>
</html>
